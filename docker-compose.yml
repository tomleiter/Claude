version: '3.8'

services:
  backend:
    image: php:8.2-cli
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    command: php -S 0.0.0.0:8080 router.php
    environment:
      - PHP_CLI_SERVER_WORKERS=4

  frontend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host"
